name: Build Fan Accessibility & Equity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *" # Monthly, on the first day at 04:17 UTC
  push:
    paths:
      - "scripts/build_fan_accessibility.py"
      - "requirements-fan-accessibility.txt"
      - ".github/workflows/build-fan-accessibility.yml"
      - "clubs.csv"

permissions:
  contents: write

concurrency:
  group: fan-accessibility-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-fan-accessibility.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fan-accessibility.txt

      - name: Build population-weighted road accessibility
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scripts/build_fan_accessibility.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fan-accessibility/fan_accessibility.geojson.gz
          git add data/fan-accessibility/fan_accessibility_summary.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Build Fan Accessibility & Equity data"
            git push
          fi
