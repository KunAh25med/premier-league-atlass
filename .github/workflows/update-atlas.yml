
name: Update atlas data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 22 * * 6,0"

permissions:
  contents: write

concurrency:
  group: update-atlas-data
  cancel-in-progress: false

jobs:
  update-atlas:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Refresh atlas and fixtures
        run: python build_atlas.py --csv

      - name: Generate real road travel matrix
        run: python build_travel_times.py

      - name: Commit generated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add atlas.json fixtures_2026_27.csv travel.json

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "chore(data): refresh atlas, fixtures and road travel"
            git push
          fi
